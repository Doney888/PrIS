<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#476779"/></marker></defs><rect x="205" y="10" width="490" height="66" rx="5" fill="#edf4f6" stroke="#39566a"/><text x="450" y="33" font-size="17" text-anchor="middle" fill="#162d3f">Расписание и состав</text><text x="450" y="57" font-size="17" text-anchor="middle" fill="#162d3f">Предоставляет участников и назначенного судью</text><path d="M450 62 L450 100" fill="none" stroke="#476779" marker-end="url(#arr)"/><text x="650" y="87" font-size="15" text-anchor="middle" fill="#162d3f">Состав занятия</text><rect x="205" y="100" width="490" height="66" rx="5" fill="#edf4f6" stroke="#39566a"/><text x="450" y="123" font-size="17" text-anchor="middle" fill="#162d3f">Учёт партий и протоколы</text><text x="450" y="147" font-size="17" text-anchor="middle" fill="#162d3f">Проверяет события, права, ревизии и подтверждение</text><path d="M450 152 L450 190" fill="none" stroke="#476779" marker-end="url(#arr)"/><text x="650" y="177" font-size="15" text-anchor="middle" fill="#162d3f">Подтверждённая ревизия</text><rect x="205" y="190" width="490" height="66" rx="5" fill="#edf4f6" stroke="#39566a"/><text x="450" y="213" font-size="17" text-anchor="middle" fill="#162d3f">Статистика и публикация</text><text x="450" y="237" font-size="17" text-anchor="middle" fill="#162d3f">Рассчитывает показатели и обновляет свод</text><path d="M450 242 L450 280" fill="none" stroke="#476779" marker-end="url(#arr)"/><text x="650" y="267" font-size="15" text-anchor="middle" fill="#162d3f">Опубликованный свод</text><rect x="205" y="280" width="490" height="66" rx="5" fill="#edf4f6" stroke="#39566a"/><text x="450" y="303" font-size="17" text-anchor="middle" fill="#162d3f">Архив и выгрузка</text><text x="450" y="327" font-size="17" text-anchor="middle" fill="#162d3f">Предоставляет подтверждённые результаты</text></svg>