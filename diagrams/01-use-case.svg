<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Arial,sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#476779"/></marker></defs><rect x="235" y="5" width="645" height="470" rx="5" fill="#edf4f6" stroke="#39566a"/><text x="550" y="35" font-size="17" text-anchor="middle" fill="#162d3f">ИС любительского бильярдного клуба</text><circle cx="110" cy="67" r="8" fill="white" stroke="black"/><path d="M110 75 L110 98" fill="none" stroke="#476779" /><path d="M88 83 L132 83" fill="none" stroke="#476779" /><path d="M110 98 L99 112" fill="none" stroke="#476779" /><path d="M110 98 L121 112" fill="none" stroke="#476779" /><text x="110" y="133" font-size="15" text-anchor="middle" fill="#162d3f">Игрок</text><path d="M136 88 L326 74" fill="none" stroke="#476779" /><ellipse cx="570" cy="74" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="80" font-size="17" text-anchor="middle" fill="#162d3f">Записаться на занятие</text><path d="M136 88 L326 117" fill="none" stroke="#476779" /><ellipse cx="570" cy="117" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="123" font-size="17" text-anchor="middle" fill="#162d3f">Посмотреть историю и рейтинг</text><circle cx="110" cy="173" r="8" fill="white" stroke="black"/><path d="M110 181 L110 204" fill="none" stroke="#476779" /><path d="M88 189 L132 189" fill="none" stroke="#476779" /><path d="M110 204 L99 218" fill="none" stroke="#476779" /><path d="M110 204 L121 218" fill="none" stroke="#476779" /><text x="110" y="239" font-size="15" text-anchor="middle" fill="#162d3f">Тренер</text><path d="M136 194 L326 180" fill="none" stroke="#476779" /><ellipse cx="570" cy="180" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="186" font-size="17" text-anchor="middle" fill="#162d3f">Изучить динамику игрока</text><path d="M136 194 L326 223" fill="none" stroke="#476779" /><ellipse cx="570" cy="223" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="229" font-size="17" text-anchor="middle" fill="#162d3f">Просмотреть показатели занятия</text><circle cx="110" cy="279" r="8" fill="white" stroke="black"/><path d="M110 287 L110 310" fill="none" stroke="#476779" /><path d="M88 295 L132 295" fill="none" stroke="#476779" /><path d="M110 310 L99 324" fill="none" stroke="#476779" /><path d="M110 310 L121 324" fill="none" stroke="#476779" /><text x="110" y="345" font-size="15" text-anchor="middle" fill="#162d3f">Судья / регистратор</text><path d="M136 300 L326 286" fill="none" stroke="#476779" /><ellipse cx="570" cy="286" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="292" font-size="17" text-anchor="middle" fill="#162d3f">Внести события партии</text><path d="M136 300 L326 329" fill="none" stroke="#476779" /><ellipse cx="570" cy="329" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="335" font-size="17" text-anchor="middle" fill="#162d3f">Подтвердить или исправить протокол</text><circle cx="110" cy="385" r="8" fill="white" stroke="black"/><path d="M110 393 L110 416" fill="none" stroke="#476779" /><path d="M88 401 L132 401" fill="none" stroke="#476779" /><path d="M110 416 L99 430" fill="none" stroke="#476779" /><path d="M110 416 L121 430" fill="none" stroke="#476779" /><text x="110" y="451" font-size="15" text-anchor="middle" fill="#162d3f">Администратор</text><path d="M136 406 L326 392" fill="none" stroke="#476779" /><ellipse cx="570" cy="392" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="398" font-size="17" text-anchor="middle" fill="#162d3f">Вести расписание и состав</text><path d="M136 406 L326 435" fill="none" stroke="#476779" /><ellipse cx="570" cy="435" rx="245" ry="20" fill="#edf4f6" stroke="#39566a"/><text x="570" y="441" font-size="17" text-anchor="middle" fill="#162d3f">Выгрузить протоколы, восстановить архив</text></svg>