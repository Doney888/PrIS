<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 399" font-family="Arial" text-anchor="middle"><rect x="215" y="5" width="470" height="53" fill="#edf4f6" stroke="#345"/><text x="450" y="25">«component» Веб-интерфейс</text><path d="M215 31h470" stroke="#345"/><text x="450" y="50" font-size="14">Требует интерфейс управления протоколами</text><path d="M450 58v41l-4 -6m4 6l4 -6" stroke="#345" fill="none"/><text x="610" y="83" font-size="14">IПротокол</text><rect x="215" y="101" width="470" height="53" fill="#edf4f6" stroke="#345"/><text x="450" y="121">«component» Учёт протоколов</text><path d="M215 127h470" stroke="#345"/><text x="450" y="146" font-size="14">Проверяет права и фиксирует подтверждение</text><path d="M450 154v41l-4 -6m4 6l4 -6" stroke="#345" fill="none"/><text x="610" y="179" font-size="14">IСтатистика</text><rect x="215" y="197" width="470" height="53" fill="#edf4f6" stroke="#345"/><text x="450" y="217">«component» Статистика</text><path d="M215 223h470" stroke="#345"/><text x="450" y="242" font-size="14">Пересчитывает показатели подтверждённой версии</text><path d="M450 250v41l-4 -6m4 6l4 -6" stroke="#345" fill="none"/><text x="610" y="275" font-size="14">IАрхив</text><rect x="215" y="293" width="470" height="53" fill="#edf4f6" stroke="#345"/><text x="450" y="313">«component» Архив</text><path d="M215 319h470" stroke="#345"/><text x="450" y="338" font-size="14">Предоставляет чтение версий и выгрузку</text></svg>